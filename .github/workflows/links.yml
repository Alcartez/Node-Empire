name: Documentation Links

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Markdown Links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline: only local files are resolved, so no network requests are
          #   made and external sites cannot make CI flaky or rate-limited.
          # --hidden: include dot-directories (e.g. .github/); the glob does not
          #   match hidden paths otherwise. .git/ is excluded explicitly.
          args: >-
            --offline
            --hidden
            --no-progress
            --verbose
            --exclude-path '(^|/)(target|scratch|\.git)/'
            './**/*.md'
          fail: true
