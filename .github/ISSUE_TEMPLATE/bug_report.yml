name: Bug Report
description: Create a report to help us fix a bug or broken invariant
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please ensure this issue has not already been reported.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: map-seed
    attributes:
      label: Map Seed & Faction
      description: If applicable, what seed and faction were you playing?
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Start new game with seed ...
        2. Build road between X and Y
        3. Observe crash / anomalous state
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, Rust version (`rustc --version`), commit hash.
