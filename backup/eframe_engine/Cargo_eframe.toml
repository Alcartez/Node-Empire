[package]
name = "node_empire"
version = "0.2.0"
edition = "2021"
description = "Node Empire - a graph-based kingdom strategy game with a custom eframe engine"

[dependencies]
eframe = "0.33"
egui = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
